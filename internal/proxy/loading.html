<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3">
  <title>Starting {{.GroupName}} …</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e2e6;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 2.5rem 2rem;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid #1f1f29;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    p  { font-size: 0.875rem; color: #888; margin: 0; }
    .host { font-family: ui-monospace, monospace; color: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Starting <span class="host">{{.GroupName}}</span> …</h1>
    <p>This page will refresh automatically once the service is ready.</p>
  </div>
</body>
</html>
